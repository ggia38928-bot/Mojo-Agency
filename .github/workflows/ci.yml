name: MarginGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --dev

      - name: Code Syntax & Style Check
        run: |
          uv run python -m py_compile src/main.py src/schemas.py src/pnl_engine.py || true

      - name: Run Pytest Unit Tests
        env:
          OPENAI_API_KEY: "mock-api-key-for-ci"
        run: |
          uv run pytest -v