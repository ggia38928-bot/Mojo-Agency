[project]
name = "marginguard-ai"
version = "0.1.0"
description = "MarginGuard AI — Multi-Agent P&L Protection System (Sea × OpenAI Codex Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MarginGuard AI Team", email = "team@marginguard.ai" }
]
keywords = ["shopee", "pnl", "multi-agent", "pydantic-ai", "e-commerce"]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
